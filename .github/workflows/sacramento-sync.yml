name: Sacramento nightly synchronization

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: sacramento-nightly-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEMO_MODE: "false"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      SACRAMENTO_LAMBDA_URL: ${{ vars.SACRAMENTO_LAMBDA_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - name: Synchronize Sacramento appeals
        run: npm run sync:sacramento
      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ocrmypdf tesseract-ocr
          python -m pip install -r worker/requirements.txt
      - name: Extract Sacramento Drive sources
        run: npm run sync:drive -- --out=work/foia-drive-manifest.json
      - name: Create versioned collections when missing
        run: python worker/sacramento_ingest.py --bootstrap
      - name: Index normalized prior appeals
        run: python worker/sacramento_ingest.py --process-appeal-comps
      - name: Ingest public Sacramento evidence
        run: python worker/sacramento_ingest.py --manifest work/foia-drive-manifest.json
      - name: Process queued private case documents
        run: python worker/sacramento_ingest.py --process-private-queue
